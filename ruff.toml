# Lint rules for the Python in this workspace.
#
# The Python here is not application code. It is derivation scripts that extract
# published coefficient tables, cross-check them against an external oracle and emit
# Rust source, plus experiment drivers. What a linter is worth on that is catching
# defects that would silently corrupt a number; what it is not worth is imposing a
# house style on transcribed tables.
#
# Pinned explicitly because ruff's default set moves between releases, and a gate
# whose rule set depends on which version happens to be installed is not a gate.
#
# Deliberately absent, each for a reason:
#   E501  a table of published coefficients is as wide as the publication made it,
#         and wrapping one is how a digit gets lost;
#   N     the names follow the sources -- `X`, `Y`, `T`, `F`, `D`, `Om` are the
#         published symbols, and renaming them to satisfy a case convention would
#         make the code harder to check against the paper it came from;
#   DTZ   the dates these scripts build come out of a data file, not off the clock;
#   EXE   the scripts run as `uv run python <script>`, never as `./<script>`;
#   S     the one `exec` is `tools/gen_dop853.py` reading scipy's own coefficient
#         module, which is the input it exists to transcribe.
target-version = "py311"

[lint]
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "C4", "SIM", "PIE", "RUF"]

# Greek letters, `×`, `−` and `µ` are the notation, not a homoglyph attack: the
# comments and docstrings quote the equations they implement.
ignore = ["RUF001", "RUF002", "RUF003"]
