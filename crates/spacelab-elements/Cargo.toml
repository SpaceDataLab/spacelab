[package]
name = "spacelab-elements"
description = "Osculating Keplerian orbital elements: state vector to elements and back, singular cases handled."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["orbital-elements", "keplerian", "astrodynamics", "orbit", "satellite"]
categories = ["aerospace", "science"]
exclude.workspace = true

[dependencies]
libm = "0.2"
spacelab-core = { path = "../spacelab-core", version = "0.1.0" }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
spacelab-propagation = { path = "../spacelab-propagation" }
spacelab-testkit = { path = "../spacelab-testkit" }

[lints]
workspace = true
