[package]
name = "spacelab-estimation"
description = "Orbit determination and estimation: square-root information and Kalman-family filters, smoothers, and conjunction probability."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["orbit-determination", "kalman", "least-squares", "conjunction", "estimation"]
categories = ["aerospace", "science", "mathematics"]
exclude.workspace = true

[dependencies]
libm = "0.2"
spacelab-autodiff = { path = "../spacelab-autodiff", version = "0.3.0" }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
spacelab-testkit = { path = "../spacelab-testkit" }
spacelab-propagation = { path = "../spacelab-propagation" }
spacelab-ndm = { path = "../spacelab-ndm" }

[lints]
workspace = true
