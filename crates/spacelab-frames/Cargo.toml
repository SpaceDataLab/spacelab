[package]
name = "spacelab-frames"
description = "Type-level reference frames: rotations that compose only when they should"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["reference-frames", "itrf", "gcrf", "rotation", "astrodynamics"]
categories = ["aerospace", "science"]
exclude.workspace = true

[package.metadata.docs.rs]
features = ["std"]

[features]
# `std` enables the CIO-frame interpolator (`CioInterpolator`), which precomputes a grid and so
# allocates; the frame algebra itself stays `no_std`.
default = []
std = []

[lints]
workspace = true

[dependencies]
spacelab-core = { path = "../spacelab-core", version = "0.1.0" }
spacelab-fa = { path = "../spacelab-fa", version = "0.1.0" }
libm = "0.2"

[dev-dependencies]
spacelab-testkit = { path = "../spacelab-testkit" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[[bench]]
name = "frames"
harness = false
