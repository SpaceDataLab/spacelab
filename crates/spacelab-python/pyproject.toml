[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
# `spacelab` on PyPI is an empty registration by someone else (pypi/support#12822); the
# import name is `spacelab` regardless.
name = "spacedatalab"
description = "Python bindings for the spacelab space-data computation core"
# The version is the crate's, read by maturin, so a release bumps one number.
dynamic = ["version"]
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "spacelab"
features = ["pyo3/extension-module"]
