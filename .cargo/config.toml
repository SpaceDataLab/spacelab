# Test threads default to a 2 MiB stack (libtest), but some force models here evaluate into large
# fixed-size, no-alloc buffers on the stack by design — notably `OceanTide`'s degree grid and its
# per-wave channels at the degree-120 ceiling (234 256 and 468 512 bytes). `GeoPotential`'s seven
# tables (833 504 bytes) are on the heap since a few nested values overflowed a thread's stack.
# Building and evaluating these on a 2 MiB test thread overflows in unoptimised (debug) builds.
# Production runs them on the 8 MiB main thread; this raises libtest's per-thread stack to match
# with headroom. `RUST_MIN_STACK` only ever *increases* a thread's stack reservation (threads with an
# explicit `stack_size` are unaffected), so it has no runtime effect.
[env]
RUST_MIN_STACK = "16777216"
