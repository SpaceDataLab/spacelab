# cargo-mutants configuration.
#
# `examine_globs`/`exclude_globs` are not used: every crate is in scope. What is listed below is the
# set of mutants that survive **because they are equivalent**, not because a test is missing. Each
# one was measured or proved before it was written down; an entry without that evidence is a test
# gap wearing a disguise, so none may be added on the strength of an argument alone. Where the
# evidence is a bounded search rather than a proof, the entry says so and states the bound.
#
# Timeouts are not listed and are not excluded, but they are not free either. A mutant that makes
# the suite stop terminating has been detected only by wall clock, and a wall clock cannot say
# whether the mutation was caught or merely slow: re-running it at three times the limit sorts the
# two apart, and whatever then finishes is an ordinary survivor and is triaged as one. That is worth
# doing rather than waving through — `dopri5.rs` timed out on a stage-time mutation that drives the
# controller to 588,536,735 steps, and the assertion which now catches it
# (`dopri5_error_estimate_costs_only_what_its_order_implies`) is the test that was missing.
#
# What a timeout does cost is a resume. `--iterate` skips mutants previously caught or unviable and
# NOT ones that timed out, so each resume re-pays every timeout in full: nine of them cost 376 s of
# build plus 2 700 s of test on the 2026-08-11 resume, about 46 % of that window's whole capacity at
# --jobs 4. The full spacelab-propagation seal produced sixteen, and all sixteen were proved rather
# than waved through. Thirteen freeze or reverse a loop counter that is strictly monotone and bounded
# in the unmutated code (`isqrt`, `harris_priester`, `xambar`, `GeoPotential::acceleration_simd`,
# `ias15_pc`, `integrate_taylor`, `factorial`, `jacobi_value_deriv`, `compute_max_ecc_pow` ×2,
# `potential_derivatives` ×2, `compute_n_sum`); two break `splint`'s binary search, whose
# `khi - klo` strictly decreases until it reaches 1; one replaces `AngularResolution::get` with 0.0
# and so bypasses the constructor invariant added by #233. Three of the thirteen — `count_cells` and
# `binom` ×2 — freeze a counter inside a `const fn` whose result initialises a `const` item, which
# makes *const evaluation* non-terminating; rustc answers that with a lint rather than an error and
# keeps evaluating, so `--timeout` never fires and only `--build-timeout` bounds it. Three of four
# job slots sat in `cargo test --no-run` for 5 h 28 m apiece before that was found.
#
# `spacelab-capi`'s seal produced a seventeenth of exactly the same shape: `keep -= 1` in
# `copy_to_c_buffer` rewritten to `keep /= 1`, which freezes the UTF-8 truncation walk on any input
# that lands mid-sequence. Same verdict, same reason -- the loop's termination is the decrement, and
# an operator that does not decrement does not terminate.
#
# The `spacelab-gnss` re-seal that followed `igrf.rs` moving out to `spacelab-geomagnetism` produced
# six more, all in `rinex.rs` and all the same shape: `block_len` forced to `Some(0)`, or the
# `idx += 1` / `idx += len` walk rewritten to `-=` or `*=`. The record loop's termination *is* that
# advance — every path through the body moves `idx` forward by at least one line and `lines` is
# finite — so a mutation that stops it moving is a non-terminating parse rather than a wrong answer.
# The unmutated parser is bounded by the input it was handed, which is the property that matters for
# a function whose input arrives over the network.
#
# Those sixteen are excluded on the resume command line (`-E`), not here. The distinction is the
# point of this file: an `exclude_re` entry claims a mutant is equivalent, and a timeout claims only
# that re-deriving a written-down proof costs a job slot. The argument therefore lives with the run
# that spends the time, in `run-gate-prop.sh`, where a reader can see it next to the `-E` it excuses.
#
# `reseal-ice-phase-noise` produced twenty-six, and they divide into six shapes rather than one.
# Eleven are `ice.rs`'s slab intersection (`face -> ([0.0; 3], -1.0)`, `dot -> 1.0`,
# `intersect -> None`, and the arithmetic and comparisons at 148, 149, 155, 156 and 166): every one of
# them makes `intersect` refuse for every ray, or return an interval the `t_in < t_out && t_out > 0`
# test then rejects, and `trace_on_grid`'s outer loop is `while hits < rays` with `hits` advancing
# only on a successful intersection. Three more freeze that same counter from the other side — the
# impact radius pushed outside the bounding disc so every ray misses (357:28, twice), and `hits += 1`
# rewritten to `hits *= 1`. Two are the input guard at 319 and 320, and they are the guard doing its
# job in reverse: mutated, it stops rejecting `aspect_ratio <= 0`, and a crystal with a non-positive
# half-length is exactly what the tracer cannot terminate on, so the *refusal* test hangs. Six are the
# two binary searches — `record`'s in `ice.rs:339` and `TabulatedPhase::interval`'s in
# `phase.rs:152` — whose termination is `hi - lo` strictly decreasing; `==` and `>=` and `hi + lo`
# each break that, and on the two-node grid the shortest-grid tests added under #286 enter with
# `hi - lo == 1`, which `>` exits and the mutants do not. Two are NaN-permeable rather than frozen:
# `phase.rs:350`'s `g.abs() < 1e-6` inverted sends the isotropic case down the `else` branch, where
# `(1 + g² − t²)/(2g)` is `0/0`, and a `NaN` cosine makes every termination test in the Monte Carlo
# walk false.
#
# The last two are not non-terminating at all, and saying so matters. `ice.rs:615:29` and `617:25`
# multiply `diffraction_on_grid`'s node count and its step by about 10⁴, and #289 measured what that
# costs: the lobe is O(x²) in the size parameter until the panel cap binds and O(x) after, with no cap
# anywhere on `bessel_j1`'s recurrence length. They are slow, not stuck. That distinction is the one
# this file's own policy says to resolve by re-running at three times the limit, so the three whose
# structural argument was least direct — `155:27`, `615:29` and `617:25` — were re-run at 540 s
# against the block's 180 s. All three were still running when it expired, so none of the twenty-six
# is an ordinary survivor wearing a wall clock.
#
# Do not read the verdict off the exit code. `LabOutcome::exit_code` (cargo-mutants 27.1.0,
# outcome.rs:110) tests `timeout > 0` *before* `missed > 0`, so a run with both reports 3 and the
# survivors are invisible in it — the `integrators` block exited 3 carrying 749 of them. The signal
# to gate on is `mutants.out/missed.txt` being empty.
#
# The timeout limit itself is left auto-set: it scales with the measured baseline test time, so a
# slower runner gets a longer budget instead of a false positive.
#
# Five parts of the workspace are deliberately not covered by an exhaustive run, and none of them
# is excluded here — an `exclude_re` entry would claim an equivalence that was never established.
# What follows is the record of the decision instead. Note that the last one is the opposite case
# from the three before it: those are mutants no test *can* kill, this one is mutants that a single
# test kills by construction. Both are reasons not to spend the hours; they are not the same reason,
# and the difference is what a reader needs to judge whether the exclusion still holds.
#
#   * `spacelab-python` **is** run, and as of 2026-08-11 it has been run to completion for the first
#     time: 2 684 mutants, 51 caught, 1 740 missed. That measurement retires the estimate this note
#     used to carry, which said "a measured 947 of its mutants cannot be reached". The mechanism it
#     named was right; the number was an estimate presented as a measurement, and it is 4.9× too big.
#
#     The mechanism, unchanged: `extension-module` leaves the interpreter to supply the CPython
#     symbols at import, so a `#[test]` naming an entry point whose signature carries an interpreter
#     token fails to link with `undefined symbol: PyErr_SetObject / PyExc_BaseException /
#     Py_IsInitialized` out of `libpyo3.rlib`. Measured twice, once through `.expect()` and once
#     through a `let Ok(..) = .. else` instantiating neither `Debug` nor `Display` on `PyErr` — the
#     second failed the same way, so the reach stops at the *signature*, not at the error path. The
#     token is a `PyResult` in the return **or** a `Python<'_>` / `Bound<'_>` parameter; classifying
#     on the return type alone finds 178 of the gated mutants and misses 16 whose only interpreter
#     contact is the `py` argument.
#
#     Counted that way, the 1 740 survivors are **194 gated** and **1 545 reachable** — plain
#     functions a `#[test]` can call, which nothing calls. One more is a trait impl the classifier
#     could not resolve. So five sixths of the survivors are ordinary missing tests rather than a
#     toolchain limit, and they cluster hard, because cargo-mutants expands a returned tuple into
#     every combination of `0.0` / `1.0` / `-1.0`: `dilution_of_precision` alone is 1 + 3⁵ = 244 of
#     them, then `swath_geometry` 82, `generate_anchors` 82, `sentman_drag_coefficients` 81,
#     `decode_box` 81, `access_windows` 46, `coverage_metrics` 40, `draim_geometry` 35. One exact
#     assertion per wrapper kills a whole product, which is why the gap is large and cheap at once.
#
#     Measured, on the fourteen largest: 856 of the 1 545 are theirs, and twelve tests kill **all
#     856** (860 in scope, 4 unviable, 0 survivors). The reachable backlog is therefore 689, and
#     what is left is longer-tailed — no cluster above 43 — so the next tranche buys less per test.
#     One result there is worth carrying forward: the first attempt left 27 alive, every one inside
#     `coverage_metrics`/`access_windows`, because the test flew an equatorial orbit with zero node
#     and zero phase, which multiplies every cross term of the orbit-plane rotation by `sin i = 0`.
#     A test can be green, exercise the line, and still be unable to see the mutation; the fix was
#     an inclined orbit checked against an independently built perifocal basis.
#
#     The remaining 194 are now reachable too. `extension-module` is an optional default feature,
#     and `--no-default-features --features test-interpreter` links libpython and starts an
#     interpreter for the test process; both illegal combinations are `compile_error!` in `lib.rs`,
#     so the configuration the wheel needs cannot be lost by accident. Measured on the three largest
#     clusters — `propagate_two_body`, `propagate_relativistic_dense` and the EOP guard of
#     `propagate_j2_itrf_eop_dense`, 123 mutants, 37 unviable — four tests kill **85 of the 86**
#     viable ones. The single survivor is the `h0` seed excluded below. The 108 gated mutants left
#     after that were ordinary backlog rather than a toolchain limit, and #257 spent it: seven scoped
#     blocks over the whole survivor list, 776 caught, 267 unviable, 25 alive. Twelve of the 25 were
#     real gaps and are closed by further tests; the other thirteen are the `h0` seed class excluded
#     below, with the measurement that justifies them.
#
#     The crate-wide re-measurement afterwards — 1 711 mutants under `test-interpreter`, iterating
#     over the 2 082 already resolved — left ten alive, all of them `cloud_mask`. Do not chase them.
#     `cloud_mask` is `#[cfg(feature = "onnx")]`: without the feature its body is not compiled, so
#     mutating it changes no binary and every test passes, which cargo-mutants reports as MISSED. Add
#     the feature and the same ten go **unviable** — the tool writes `PyResult::new(vec![])` and
#     `PyResult::from_iter([..])` against a type alias for `Result`, which is `E0599` / `E0271`. No
#     exclusion is written for them, because an exclusion would claim an equivalence; the truth is
#     that no viable mutant of that signature exists.
#
#     Two of those tests are worth naming, because the oracle was the hard part. The relativistic
#     bundle is checked against the same four forces integrated with the Sun's velocity from an
#     independent five-point stencil at ten times the step: the two agree to 9.1e-6 m over a day and
#     the de Sitter term they feed is worth 5.1e-3 m of the answer, so the bound sits between them.
#     The ITRF-frame J2 propagator has no such reference, and got a metamorphic one instead — the
#     epoch and the two offsets are one timeline, so advancing the epoch by a day and taking a day
#     off both offsets must not move the trajectory. It does not: 0 m, exactly. That test needs
#     realistic polar motion to bite. A zonal J2 is invariant under rotation about the pole, so at
#     `xp = yp = 0` the ITRF z-axis *is* the CIP and a UT1 error cancels — 4.7e-9 m for 100 s, which
#     is f64 noise in the rotation. At 0.2" the pole and the rotation axis part company and the same
#     error is worth 2.7e-5 m.
#
#     The block is also scoped by five `--exclude-re` flags on the command line, for the same
#     reason `geopotential_coeffs.rs` is below: not that no test can kill those mutants, but that
#     one test kills all of them. `--list` offers 19 239 mutants for `lib.rs` and 16 529 of them —
#     86% — belong to five functions, because a whole-function replacement over a wide tuple is
#     enumerated once per point of the grid of its components' replacement values (`u32` -> {0,1},
#     `f64` -> {0,1,-1}, `Vec<T>` -> empty or one element):
#
#         street_of_coverage_geometry  Option<(u32, u32, f64 x 7)>    1 + 2*2*3^7 = 8749
#         constellation_fom            (u32, f64 x 6, u32)                2*3^6*2 = 2916
#         space_weather_days           (Vec<i32>, Vec<u32> x2, Vec<f64> x3)  4*9*64 = 2304
#         density_altitude_normalized  (the same shape)                             = 2304
#         density_data_samples         (Vec<f64> x 4)                          4^4 =  256
#
#     Each identity reproduces its listed count exactly, which is what says the explosion is the
#     return type and nothing else. One `assert_eq!` on the whole tuple fails against every point
#     of a grid at once, so those are not 16 529 questions — they are five, asked 16 529 times. The
#     flags keep one representative of each and drop 16 524, measured: `--list` under them returns
#     2 715 lines carrying exactly the five representatives. Each representative, and one of the
#     8 748 dropped `Some((0, 0, 0.0, ...))` as a control, was applied to the working tree by hand
#     and failed exactly one test -- respectively `the_street_of_coverage_bridge_returns_nine_
#     geometry_fields_in_the_documented_order`, `the_constellation_fom_bridge_maps_five_named_
#     columns_onto_a_positional_tuple`, `the_space_weather_bridge_returns_six_row_aligned_columns`,
#     `the_height_normalized_density_bridge_drops_flagged_and_non_positive_rows` and
#     `the_density_sample_bridge_returns_four_row_aligned_columns`. Those five tests are what the
#     collapse rests on: delete one and its whole product silently stops being measured, which is
#     why they are named here rather than left to be rediscovered.
#   * `spacelab-fa`'s `cio_tables.rs` (3 864 mutants) and `nut_tables.rs` (3 118) are sampled at
#     `--shard 1/20 --sharding round-robin`, an unbiased 5%. These are machine-generated coefficient
#     tables whose verification is a unit check against pyerfa and the SOFA `t_xy06` / `t_s06` /
#     `t_nut00a` vectors to better than 5e-18 rad — an argument a per-coefficient mutation run does
#     not strengthen. The sample measures the survival rate rather than asserting it.
#   * `spacelab-gpu` (1 128) is sampled the same way, because its tests are hardware-gated and a
#     full run on a machine without the device measures the gate, not the kernels.
#   * `spacelab-slr`'s `loading_tables.rs` is excluded from the run by `--exclude` on the command
#     line rather than by an entry here, for the same reason as the `spacelab-fa` tables and with a
#     sharper bound. It is the 342-constituent Cartwright-Tayler-Edden development, machine-read
#     from `ADMINT.F`; its mutants flip the sign of one equilibrium amplitude. The only oracle that
#     exists for the model is `HARDISP`'s published series, printed to six decimals, and flipping
#     the sign of the smallest amplitudes moves the displacement by about 6e-7 m -- under that
#     print resolution. So those mutants cannot be killed by any test built on the reference, and
#     an `exclude_re` entry would be claiming an equivalence that is really a limit of the oracle.
#     What does hold the table is the 144-value comparison against that series, which no
#     per-coefficient mutation run strengthens.
#   * `spacelab-propagation`'s `geopotential_coeffs.rs` is excluded on the command line for the
#     opposite reason: not that no test can kill its mutants, but that one test kills all of them.
#     The file declares no functions — it is the XGM2019e table to degree 120 — and all **7 360** of
#     its mutants are `delete -` on a coefficient literal. `generated_tables.rs::the_gravity_field_
#     is_the_table_the_generator_wrote` folds every element of all 7 378 rows into one FNV-1a value
#     and compares it against a fixed seal, so changing any single coefficient in any way fails it.
#     Confirmed by hand at both extremes: flipping (2, 0) and flipping (120, 120) each fail that
#     test and no other. Running them is a quarter of the workspace's slowest block to re-derive one
#     assertion 7 360 times. The exclusion is only as good as that test, which is why it is named
#     here — delete the test and the exclusion becomes a hole.

# Build and test under the `mutants` profile (workspace Cargo.toml), not `dev`. The numerical suites
# are arithmetic in a loop, and unoptimised they cost fifty times what they cost optimised — 12.9 s
# against 0.27 s for spacelab-astro's 47 tests. Multiplied by a crate's mutant count that is the
# difference between a run that finishes in the hour and one that does not. The profile keeps debug
# assertions and overflow checks on, so nothing that was a detector under `dev` stops being one.
additional_cargo_args = ["--profile", "mutants"]

# Cap rustc's lints for the mutated builds. A mutant that returns a constant leaves the arguments
# it no longer reads unused, which is a warning — and CI sets `RUSTFLAGS: -D warnings` for the whole
# workflow, so the mutant does not compile and is recorded UNVIABLE. Unviable is not a survivor, so
# the run stays green while never asking the question. Measured on spacelab-testkit's 21 mutants
# under `RUSTFLAGS=-D warnings`: 9 caught and 12 unviable without this, 21 caught and 0 unviable
# with it. That is 57% of a crate the CI gate silently declined to test, and the same lints do not
# fire locally, so the local seal and the CI gate were not measuring the same thing.
cap_lints = true

# Every pattern is anchored to `file:line:col` — the form cargo-mutants prints in `missed.txt`.
# A pattern that named only the function would also exclude every other mutant of that operator in
# it: `CioInterpolator::interpolate` alone has four `+` sites, three of which are caught, and
# excluding those would quietly remove real coverage while reading as a documented equivalence.
#
# Which also means every pattern here expires the moment anything is inserted above it. That happened
# once, to both `spacelab-capi` entries, when a ten-line block was added near the top of its
# `lib.rs`: the anchors stopped matching, the two mutants quietly came back, and the only visible
# symptom was the run reporting 49 mutants where the previous one reported 47. `just mutants NAME
# FILES` calls `just mutants-anchors` on every file before starting, which turns that into an error;
# `just mutants-pkg` does not. Run `just mutants-anchors <file>` after editing any file that has an
# entry here — it prints `N entries, N mutants excluded, 0 broken` when the anchors are live.
#
# It then happened a second time, and the check did not catch it: it could not tell a path-qualified
# anchor that had drifted from one that correctly belongs to a different crate's `lib.rs`, because
# both simply fail to match and both were counted as `same-name anchors elsewhere`. The two
# `spacelab-capi` entries were wrong, and silently excluding nothing, for as long as that lasted.
# The recipe now separates the two cases — an anchor carrying a `/` names exactly one file, so a
# miss on it is drift and is reported broken.
exclude_re = [
    # `let e = if r2 > 0.0 { atan2(y, x) } else { 0.0 }` in `gcrf_to_cirs`. `r2 = X² + Y²` is
    # non-negative, so `>` and `>=` differ only at `r2 == 0` — where `d = atan(√(r2/(1−r2))) = 0`,
    # `R₂(d) = I`, and the rotation collapses to `R₃(−(E+s))·R₃(E) = R₃(−s)`: `E` cancels, whichever
    # value the branch picked. Both halves proved in `derivations/cio_frame_branch.mac`.
    "cio\\.rs:36:19: replace > with >= in gcrf_to_cirs",

    # The Lagrange stencil origin in `CioInterpolator::interpolate`, `− STENCIL/2 + 1`. Mutating the
    # `+ 1` to `− 1` or `* 1` slides the stencil by two nodes and one node. Measured over the whole
    # grid at LEO, 700 samples: the worst departure from the exact chain is 1.8626e-9 m centred and
    # 1.8626e-9 m at either shift — identical. Sliding it by four nodes, far enough that the query
    # leaves the stencil, still only reaches 2.3078e-9 m, so no accuracy assertion can resolve any of
    # this: the CIP is polynomial-smooth over eight 600 s nodes. What the offset *does* control is
    # whether the query is inside its own stencil, and that is asserted as an index by the
    # `debug_assert!` in `interpolate` — which is why the ±4 mutants die and these two do not.
    # Centring is a quality choice with no measurable consequence on this grid, not a tested property.
    "cio_fast\\.rs:220:61: replace \\+ with - in CioInterpolator::interpolate",
    "cio_fast\\.rs:220:61: replace \\+ with \\* in CioInterpolator::interpolate",

    # `mean_response_time: if span > 0.0 { span / 2.0 } else { 0.0 }` on the no-passes path. At
    # `span == 0` the two agree at `0.0 / 2.0 == 0.0`; below zero both take the else. The one
    # residual difference is the sign of the zero — `t1 = −0.0, t0 = 0.0` gives `span = −0.0`, where
    # `>=` returns `−0.0` and `>` returns `+0.0` — and no float comparison in the crate, `PartialEq`
    # included, tells those apart. The `>` form is kept because it is the one that reads as a guard.
    "metrics\\.rs:53:41: replace > with >= in metrics",

    # `let kind = if sign_next > 0 { Rising } else { Falling }`, reached only inside
    # `sign_prev != 0 && sign_next != 0 && sign_prev != sign_next`. `sign_of` returns `-1`, `0` or
    # `+1`, so `sign_next ∈ {−1, +1}` here and `> 0` and `>= 0` agree on both.
    "event\\.rs:70:41: replace > with >= in find_events",

    # --- `brent`'s acceptance rule. Proved unreachable or provably indistinguishable. ---

    # `if d.abs() > tol1 { b += d } else { b += ±tol1 }`. The two differ only at `|d| == tol1`, and
    # there they compute the same `b`. `d` is either `xm` — and the convergence test at line 155 has
    # already returned unless `|xm| > tol1`, so that branch cannot tie — or the accepted step `p/q`.
    # Acceptance requires `2p < 3·xm·q − |tol1·q|` with `p = |p| ≥ 0`, which forces `xm·q > 0`; so
    # `q` carries the sign of `xm` and `d = p/q` does too. At `|d| == tol1` that makes `d` exactly
    # the `sign(xm)·tol1` the else branch adds.
    "root\\.rs:198:20: replace > with >= in brent",

    # `b += if xm > 0.0 { tol1 } else { -tol1 }`. `xm == 0.0` is unreachable: `xm` is not reassigned
    # after line 149, line 155 returns when `xm.abs() <= tol1`, and `tol1 = 2ε|b| + tol/2 > 0`
    # because `tol > 0` is checked on entry. So `|xm| > tol1 > 0` wherever this is evaluated.
    "root\\.rs:201:24: replace > with >= in brent",

    # `if (fb > 0.0) == (fc > 0.0)`, left operand. `fb == ±0` does reach here, but the block it
    # guards writes only `c`, `fc`, `d` and `e`. The next iteration cannot swap (`|fc| < |fb| = 0`
    # is false) and returns at `if fb == 0.0` with a bracket built from `b` and `evals` alone —
    # neither of which the block touches. The difference is real and unobservable.
    "root\\.rs:212:16: replace > with >= in brent",

    # Same test, right operand. `fc` is never ±0 here: it is written in exactly three places, and
    # each writes a value already known to be nonzero — before the loop (line 120 returned if
    # `fa == 0`); inside the swap, whose guard `fc.abs() < fb.abs()` forces `fb != 0` and whose body
    # sets `fc` to that `fb`; and at line 213, where `fa` is the `fb` that passed line 151's
    # `fb == 0.0` return.
    "root\\.rs:212:30: replace > with >= in brent",

    # --- The two below are NOT proofs. Each is a measure-zero tie whose reachable instances were
    # --- shown to produce the identical step, plus a bounded search that found no counterexample:
    # --- 2.3 million (function, bracket, tolerance) shapes — polynomial, rational, flat-rooted and
    # --- randomised over eight decades of bracket width and fourteen of tolerance — with no
    # --- difference in the returned bracket, the root or the evaluation count. Treat them as open
    # --- if `brent` is ever changed.

    # `if e.abs() >= tol1 && fa.abs() > fb.abs()`, the second test. It ties at `|fa| == |fb|`, which
    # opens interpolation where the baseline bisects. If the two share a sign, `s = fb/fa = 1` makes
    # `q` exactly zero by either formula, so `min1 = min2 = 0`, `2p < 0` is false for `p ≥ 0`, and
    # both paths fall through to `d = xm`. If they differ in sign and `a == c`, the secant gives
    # `p = −2·xm` and `q = 2`, and `p/q` comes out as exactly `xm` — with the sign flip for negative
    # `xm` and without it for positive — so an accepted step is the bisection step itself. Only
    # opposite signs in the inverse-quadratic branch are unproved.
    "root\\.rs:161:40: replace > with >= in brent",

    # NOT a proof. `if libm::fabs(dx) < 1e-14` in `Cr3bp::collinear_points`, the Newton break, tied
    # to `<=`. The two differ only when the correction is exactly `1e-14`, and `dx` is the quotient
    # of two computed doubles, so landing on that value is a measure-zero coincidence. Bounded
    # search: 400 003 mass ratios spanning `(2e-15, ½]` — the whole documented domain of `μ` —
    # produced no difference in any of the three returned doubles, bit for bit. The other five
    # mutants of this iteration's private state do separate somewhere in that range and are killed
    # by the `μ = 0.4639` row of `the_collinear_points_are_the_correctly_rounded_roots_of_the_gradient`.
    "cr3bp\\.rs:96:35: replace < with <= in Cr3bp::collinear_points",

    # --- `lambert.rs`. Tolerance ties, an unreachable runaway guard, and a scan that cannot see a
    # sample landing exactly on its root.
    #
