[package]
name = "spacelab-gnss"
description = "Multi-constellation GNSS: GPS, Galileo, BeiDou, QZSS, NavIC and GLONASS broadcast orbits, RINEX 3/4 and SP3 parsing, observation processing, tropospheric mapping and DOP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gnss", "gps", "galileo", "rinex", "beidou"]
categories = ["aerospace", "science::geo", "parser-implementations"]
exclude.workspace = true

[dependencies]
libm = "0.2"
spacelab-autodiff = { path = "../spacelab-autodiff", version = "0.2.0" }
spacelab-core = { path = "../spacelab-core", version = "0.2.0" }
spacelab-geomagnetism = { path = "../spacelab-geomagnetism", version = "0.2.0" }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
spacelab-elements = { path = "../spacelab-elements" }
spacelab-testkit = { path = "../spacelab-testkit" }

[features]
default = ["std"]
std = []

[lints]
workspace = true
