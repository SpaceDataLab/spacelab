[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
# The organisation's Python entry point, for distribution and import alike: its top level is the
# spacelab core, and later SpaceDataLab products arrive as submodules. A top-level `spacelab`
# would also collide with another project's package of that name.
name = "spacedatalab"
description = "Python bindings for the spacelab space-data computation core"
readme = "README.md"
# The version is the crate's, read by maturin, so a release bumps one number.
dynamic = ["version"]
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
keywords = ["astrodynamics", "orbit", "sgp4", "gnss", "space"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://spacedatalab.org"
Repository = "https://github.com/SpaceDataLab/spacelab"
Changelog = "https://github.com/SpaceDataLab/spacelab/blob/main/CHANGELOG.md"
Issues = "https://github.com/SpaceDataLab/spacelab/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "spacedatalab"
features = ["pyo3/extension-module"]
