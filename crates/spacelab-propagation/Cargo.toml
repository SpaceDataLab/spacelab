[package]
name = "spacelab-propagation"
description = "Orbit propagation: verified integrators (Runge-Kutta, multistep, symplectic, Taylor), the IERS 2010 force model, atmospheric density models, DSST and attitude."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["orbit-propagation", "ode", "runge-kutta", "dsst", "astrodynamics"]
categories = ["aerospace", "aerospace::simulation", "science", "mathematics"]
exclude.workspace = true

[dependencies]
libm = "0.2"
# Portable, `no_std`, safe SIMD (SSE2 baseline, AVX2 with `target-feature`/`target-cpu=native`) for
# the f64 geopotential hot loop. The geopotential is flop-bound (measured: layout is speed-neutral),
# so lane parallelism is the only speed lever; accuracy is unaffected (the model is validated to a
# 1e-9 tolerance, SIMD reorder changes ~1e-16). pulp (runtime AVX-512 dispatch) is the future upgrade.
wide = "1.7"
spacelab-coverage = { path = "../spacelab-coverage", version = "0.3.0" }
spacelab-autodiff = { path = "../spacelab-autodiff", version = "0.3.0" }
# Centred-dipole magnetic coordinates for the high-latitude block of the wind model. `no_std`.
spacelab-geomagnetism = { path = "../spacelab-geomagnetism", version = "0.3.0", default-features = false }

[features]
default = ["std"]
std = []

[dev-dependencies]
spacelab-testkit = { path = "../spacelab-testkit" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
spacelab-core = { path = "../spacelab-core" }
spacelab-sensors = { path = "../spacelab-sensors" }

[[bench]]
name = "propagation"
harness = false

[lints]
workspace = true
