[package]
name = "spacelab-fa"
description = "Fundamental astronomy: time scales, Earth rotation, reference frames"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["sofa", "iau", "precession", "nutation", "time-scales"]
categories = ["aerospace", "science", "date-and-time", "no-std"]
exclude.workspace = true

[lints]
workspace = true

[dependencies]
spacelab-core = { path = "../spacelab-core", version = "0.3.0" }
libm = "0.2"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
spacelab-testkit = { path = "../spacelab-testkit" }
